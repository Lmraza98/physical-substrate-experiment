name: Hosted execution probe
on:
  push:
    branches:
      - hosted-execution-probe
permissions:
  contents: read
  id-token: write
jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install EmbeddedCI cloud SDK
        run: python3 -m pip install --quiet 'embeddedci[cloud]'
      - name: Exercise official EmbeddedCI OIDC exchange
        shell: bash
        run: |
          python3 - <<'PY'
          from embeddedci.benchpod.cloud_auth import mint_oidc_token, exchange_token, DEFAULT_AUDIENCE
          import urllib.error, json
          print('=== OFFICIAL_OIDC_EXCHANGE_BEGIN ===')
          print('audience=',DEFAULT_AUDIENCE)
          try:
              tok=mint_oidc_token()
              print('oidc_minted=',bool(tok),'token_len=',len(tok))
              resp=exchange_token('https://www.embeddedci.com',tok)
              # Never emit any credential/session token. Print only key names and non-secret authorization metadata.
              print('exchange_success=True')
              print('response_keys=',sorted(resp.keys()))
              for k,v in resp.items():
                  if any(s in k.lower() for s in ['token','secret','key']): continue
                  print(k,'=',v)
          except Exception as e:
              print('exchange_success=False')
              print('error_type=',type(e).__name__)
              print('error=',str(e)[:1000])
          print('=== OFFICIAL_OIDC_EXCHANGE_END ===')
          PY
