name: Hosted execution probe
on:
  push:
    branches:
      - hosted-execution-probe
permissions:
  contents: read
  id-token: write
jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install EmbeddedCI cloud SDK
        run: python3 -m pip install --quiet 'embeddedci[cloud]'
      - name: Inspect and exercise EmbeddedCI OIDC path
        shell: bash
        run: |
          set +e
          echo '=== EMBEDDEDCI_PACKAGE_BEGIN ==='
          python3 - <<'PY'
          import embeddedci, pathlib, re
          root=pathlib.Path(embeddedci.__file__).parent
          print('package_root=',root)
          for p in root.rglob('*.py'):
              try: s=p.read_text(errors='ignore')
              except: continue
              if 'ACTIONS_ID_TOKEN' in s or 'oidc' in s.lower() or 'embeddedci:' in s:
                  print('FILE',p.relative_to(root))
                  for line in s.splitlines():
                      if any(x in line.lower() for x in ['oidc','actions_id_token','/api/','embeddedci:']):
                          print(line[:500])
          PY
          echo '=== EMBEDDEDCI_PACKAGE_END ==='
          echo '=== EMBEDDEDCI_AUTH_PROBE_BEGIN ==='
          python3 - <<'PY'
          import os, urllib.request, urllib.parse, json
          u=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL'); t=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          if not (u and t):
              print('OIDC_UNAVAILABLE'); raise SystemExit
          # Mint only for the service audience; never print token.
          url=u+('&' if '?' in u else '?')+urllib.parse.urlencode({'audience':'https://embeddedci.com'})
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'bearer '+t}),timeout=15) as r:
              tok=json.load(r)['value']
          print('oidc_minted=',bool(tok),'token_len=',len(tok))
          # Deliberately probe only service-level API roots; do not name or address any device.
          for path in ['/api/benchpod','/api/benchpods','/api/devices','/api/benchpod/session','/api/oidc']:
              req=urllib.request.Request('https://www.embeddedci.com'+path,headers={'Authorization':'Bearer '+tok,'User-Agent':'physical-substrate-experiment/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(1000).decode(errors='replace'); print(path,'HTTP',r.status,body[:500].replace('\n',' '))
              except Exception as e:
                  code=getattr(e,'code',None); body=''
                  try: body=e.read(1000).decode(errors='replace')
                  except: pass
                  print(path,'HTTP',code,'ERR',type(e).__name__,body[:500].replace('\n',' '))
          PY
          echo '=== EMBEDDEDCI_AUTH_PROBE_END ==='
