name: Hosted execution probe
on:
  push:
    branches:
      - hosted-execution-probe
permissions:
  contents: read
  id-token: write
jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe delegated execution
        run: python3 probes/delegation_probe.py
